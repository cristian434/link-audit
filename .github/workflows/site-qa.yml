name: Site QA (Figma + copy + links)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live page URL"
        required: true
      figma_url:
        description: "Figma link (full-page frame, or any layer inside its section)"
        required: false
        default: ""
      figma_mobile_url:
        description: "Figma mobile frame link (optional)"
        required: false
        default: ""
      copy_doc_url:
        description: "Copy doc link (Google Doc or .docx in Drive)"
        required: false
        default: ""

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site_qa/requirements.txt

      - name: Install
        run: |
          pip install -r site_qa/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run QA
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SITE_URL: ${{ inputs.site_url }}
          FIGMA_URL: ${{ inputs.figma_url }}
          FIGMA_MOBILE_URL: ${{ inputs.figma_mobile_url }}
          DOC_URL: ${{ inputs.copy_doc_url }}
        run: |
          python site_qa/site_qa.py \
            --site "$SITE_URL" \
            --figma "$FIGMA_URL" \
            --figma-mobile "$FIGMA_MOBILE_URL" \
            --doc "$DOC_URL" \
            --out report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-qa-report
          path: report/
          retention-days: 30
