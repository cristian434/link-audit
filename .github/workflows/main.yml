name: Broken link audit

on:
  schedule:
    - cron: "0 12 * * 1"   # Every Monday 12:00 UTC (7:00 in Colombia)
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site to audit"
        default: "https://getgoodlab.com"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: link-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run audit
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL || 'https://getgoodlab.com' }}
          OUT_DIR: audit-output
          CHECK_EXTERNAL: ${{ vars.CHECK_EXTERNAL || 'false' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: ${{ vars.PUBLISH_PAGES == 'true' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: node audit.mjs

      - name: Save report (downloadable from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-${{ github.run_number }}
          path: audit-output/
          retention-days: 90

      - name: Prepare Pages site
        if: vars.PUBLISH_PAGES == 'true'
        run: mkdir -p site && cp audit-output/report.html site/index.html && cp audit-output/report.csv site/

      - name: Upload Pages site
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: audit
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
